name: Build ColorPickerUI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build WPF solution
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ColorPickerSolution.sln

      - name: Build solution
        run: dotnet build ColorPickerSolution.sln --configuration Release --no-restore
